# Runs on every push and pull request. Only the offline suites run here: they need no API keys and
# no database. The live-model (*_live_test.py), end-to-end (e2e_*) and Supabase-backed isolation and
# orchestrator tests need credentials or a local Supabase stack, so they stay manual (see README).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run offline test suites
        run: |
          set -e
          for t in rules commander eligibility_commander prior_auth_commander prior_auth_determiner \
                   appeals_commander appeals_agent cob cost_estimate ocr_gate; do
            echo "::group::tests/${t}_test.py"
            python "tests/${t}_test.py"
            echo "::endgroup::"
          done

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t foresight-backend:ci backend
      - name: Smoke-test the image imports
        run: docker run --rm --entrypoint python foresight-backend:ci -c "import app.main"
